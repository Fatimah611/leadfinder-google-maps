<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your Company Lead Finder</title>
<style>
  :root {
    --orange: #F06A1A;
    --blue: #3B7DD8;
    --ink: #1D2430;
    --paper: #F7F8FA;
    --line: #E3E7EC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  header {
    background: linear-gradient(90deg, var(--orange), var(--blue));
    padding: 22px 32px;
    color: white;
  }
  header h1 { margin: 0; font-size: 22px; letter-spacing: 0.3px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: 0.92; }

  .container { max-width: 1000px; margin: 28px auto; padding: 0 20px; }

  .card {
    background: white;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px 24px;
    margin-bottom: 22px;
  }
  .card h2 {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--blue);
    margin: 0 0 16px;
  }

  .form-row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .field { flex: 1; min-width: 180px; }
  .field label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; }
  .field input {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 14px;
  }
  .field input:focus { outline: 2px solid var(--blue); border-color: var(--blue); }

  button {
    background: var(--orange);
    color: white;
    border: none;
    padding: 11px 22px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #d85c10; }
  button:disabled { background: #ccc; cursor: not-allowed; }

  .btn-secondary {
    background: white;
    color: var(--blue);
    border: 1px solid var(--blue);
  }
  .btn-secondary:hover { background: #eef4fc; }

  #progressWrap { margin-top: 16px; display: none; }
  .progress-bar-bg {
    background: var(--line);
    border-radius: 20px;
    height: 10px;
    overflow: hidden;
  }
  .progress-bar-fill {
    background: var(--blue);
    height: 100%;
    width: 0%;
    transition: width 0.3s;
  }
  #progressLabel { font-size: 13px; color: #555; margin-top: 6px; }

  #log {
    background: #111722;
    color: #9fe6a0;
    font-family: 'Consolas', monospace;
    font-size: 12.5px;
    padding: 14px;
    border-radius: 8px;
    height: 220px;
    overflow-y: auto;
    white-space: pre-wrap;
    margin-top: 14px;
    display: none;
  }

  .stats { display: flex; gap: 24px; margin-top: 16px; }
  .stat-box {
    flex: 1;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 16px;
    text-align: center;
  }
  .stat-box .num { font-size: 22px; font-weight: 700; color: var(--orange); }
  .stat-box .label { font-size: 12px; color: #666; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  th { background: var(--paper); color: var(--blue); font-size: 11.5px; text-transform: uppercase; }
  tr:hover { background: #fafbfc; }
  a.social-link { color: var(--blue); text-decoration: none; }

  .downloads { display: flex; gap: 10px; margin-top: 16px; }
  .empty-state { color: #888; font-size: 13px; padding: 20px 0; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>Your Company Lead Finder</h1>
  <p>Where Intelligence Meets Automation</p>
</header>

<div class="container">

  <div class="card">
    <h2>New Search</h2>
    <div class="form-row">
      <div class="field">
        <label>Search term (as typed on Google Maps)</label>
        <input id="query" placeholder="e.g. dental clinics in Toronto">
      </div>
      <div class="field">
        <label>City label</label>
        <input id="city" placeholder="e.g. Toronto">
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label>Category label</label>
        <input id="category" placeholder="e.g. Dental Clinic" value="Dental Clinic">
      </div>
      <div class="field">
        <label>How many new leads</label>
        <input id="max_results" type="number" value="100" min="1" max="500">
      </div>
    </div>
    <button id="startBtn" onclick="startSearch()">Start Search</button>

    <div id="progressWrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
      <div id="progressLabel">Starting...</div>
    </div>

    <div id="log"></div>
  </div>

  <div class="card">
    <h2>Results — Current Search</h2>
    <div class="stats">
      <div class="stat-box"><div class="num" id="totalCount">0</div><div class="label">Total leads in this file</div></div>
    </div>
    <div class="downloads" id="currentDownloads">
      <span style="font-size:13px;color:#888;">Run a search to see download links here.</span>
    </div>
    <div id="tableWrap"></div>
  </div>

  <div class="card">
    <h2>Your Lead Files</h2>
    <p style="font-size:13px;color:#666;margin-top:-8px;">Every city/category search gets its own file — nothing gets mixed together.</p>
    <div id="filesList"></div>
  </div>

</div>

<script>
let polling = null;

function startSearch() {
  const query = document.getElementById('query').value.trim();
  const city = document.getElementById('city').value.trim();
  const category = document.getElementById('category').value.trim();
  const max_results = document.getElementById('max_results').value;

  if (!query || !city) {
    alert('Please enter both a search term and a city label.');
    return;
  }

  fetch('/start', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({query, city, category, max_results})
  }).then(r => r.json()).then(data => {
    if (!data.ok) { alert(data.message); return; }
    document.getElementById('startBtn').disabled = true;
    document.getElementById('progressWrap').style.display = 'block';
    document.getElementById('log').style.display = 'block';
    document.getElementById('log').textContent = '';
    polling = setInterval(pollStatus, 1500);
  });
}

function pollStatus() {
  fetch('/status').then(r => r.json()).then(data => {
    const logEl = document.getElementById('log');
    logEl.textContent = data.log.join('\n');
    logEl.scrollTop = logEl.scrollHeight;

    const pct = data.total > 0 ? Math.min(100, Math.round((data.progress / data.total) * 100)) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressLabel').textContent =
      data.running ? `Working... ${data.progress}/${data.total}` : (data.done ? 'Done!' : 'Idle');

    if (!data.running && data.done) {
      clearInterval(polling);
      document.getElementById('startBtn').disabled = false;
      loadResults();
    }
  });
}

function loadResults() {
  fetch('/results').then(r => r.json()).then(data => {
    document.getElementById('totalCount').textContent = data.count;

    const downloadsEl = document.getElementById('currentDownloads');
    if (data.file_base) {
      downloadsEl.innerHTML =
        `<button class="btn-secondary" onclick="window.location.href='/download/${data.file_base}/xlsx'">Download Excel (.xlsx)</button>` +
        `<button class="btn-secondary" onclick="window.location.href='/download/${data.file_base}/csv'">Download CSV</button>` +
        `<button class="btn-secondary" onclick="loadResults()">Refresh Table</button>`;
    }

    const wrap = document.getElementById('tableWrap');
    if (data.rows.length === 0) {
      wrap.innerHTML = '<div class="empty-state">No leads yet — run a search above.</div>';
      return;
    }

    let html = '<table><thead><tr>' +
      '<th>Business</th><th>Email</th><th>City</th><th>Website</th><th>Category</th>' +
      '<th>FB</th><th>IG</th><th>LinkedIn</th><th>WhatsApp</th></tr></thead><tbody>';

    data.rows.slice().reverse().forEach(row => {
      html += '<tr>' +
        `<td>${row.business_name || ''}</td>` +
        `<td>${row.email || ''}</td>` +
        `<td>${row.city || ''}</td>` +
        `<td>${row.website ? `<a class="social-link" href="${row.website}" target="_blank">link</a>` : ''}</td>` +
        `<td>${row.category || ''}</td>` +
        `<td>${row.facebook ? `<a class="social-link" href="${row.facebook}" target="_blank">FB</a>` : ''}</td>` +
        `<td>${row.instagram ? `<a class="social-link" href="${row.instagram}" target="_blank">IG</a>` : ''}</td>` +
        `<td>${row.linkedin ? `<a class="social-link" href="${row.linkedin}" target="_blank">LI</a>` : ''}</td>` +
        `<td>${row.whatsapp ? `<a class="social-link" href="${row.whatsapp}" target="_blank">WA</a>` : ''}</td>` +
        '</tr>';
    });
    html += '</tbody></table>';
    wrap.innerHTML = html;
  });
  loadFilesList();
}

function loadFilesList() {
  fetch('/files').then(r => r.json()).then(data => {
    const el = document.getElementById('filesList');
    if (data.files.length === 0) {
      el.innerHTML = '<div class="empty-state">No searches run yet.</div>';
      return;
    }
    let html = '<table><thead><tr><th>Search</th><th>Leads</th><th>Download</th></tr></thead><tbody>';
    data.files.forEach(f => {
      const label = f.base.replace('leads_', '').replace(/_/g, ' ');
      html += `<tr><td>${label}</td><td>${f.count}</td><td>` +
        `<button class="btn-secondary" onclick="window.location.href='/download/${f.base}/xlsx'">Excel</button> ` +
        `<button class="btn-secondary" onclick="window.location.href='/download/${f.base}/csv'">CSV</button>` +
        `</td></tr>`;
    });
    html += '</tbody></table>';
    el.innerHTML = html;
  });
}

// load existing results on page open
loadResults();
</script>

</body>
</html>
